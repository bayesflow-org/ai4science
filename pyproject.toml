[project]
name = "ai4science"
version = "0.1.0"
description = "BayesFlow workshop materials for simulation-based inference"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bayesflow==2.0.14",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jax>=0.4.30",
    "jupyterlab>=4.3",
    "keras>=3.15.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pyabc>=0.13.0",
    "scikit-learn>=1.5",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
hnn = ["hnn-core[parallel]==0.6.1; sys_platform != 'win32'"]
nle = ["pymc>=5.24,<6", "arviz>=0.21,<1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorials"]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
